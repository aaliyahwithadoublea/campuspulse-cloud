name: Deploy dashboard to S3 # Run on every push to main that touches the dashboardon:  push:    branches: [main]    paths:      - 'dashboard/**'      - '.github/workflows/deploy.yml'  workflow_dispatch:        # also allows running it by hand from the Actions tab jobs:  deploy:    runs-on: ubuntu-latest     steps:      - name: Check out the repository        uses: actions/checkout@v4       - name: Set up Node        uses: actions/setup-node@v4        with:          node-version: '20'          cache: 'npm'          cache-dependency-path: dashboard/package-lock.json       - name: Install dependencies        working-directory: dashboard        run: npm ci       - name: Build        working-directory: dashboard        run: npm run build       - name: Configure AWS credentials        uses: aws-actions/configure-aws-credentials@v4        with:          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}          aws-region: us-east-1       - name: Upload to S3        working-directory: dashboard        # --delete removes files in the bucket that are no longer in the build,        # which is what stops old hashed assets piling up        run: aws s3 sync dist/ s3://group5-techarkit-storage/ --delete
